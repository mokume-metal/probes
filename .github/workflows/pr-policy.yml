# PR と起票の決まりごとを検査する。**main の ruleset が必須にしているのはこのジョブだけ**である。
#
# 物差しの本体の検査 (Probe・Drift の swift test) は画素を読むので Metal が要り、GitHub の
# Linux の runner では回らない。手元で回して、結果を PR 本文に書く (CONTRIBUTING.md)。
name: PR policy

on:
  pull_request:
    # タイトルを直したときも検査し直す
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # squash merge では PR タイトルがそのまま main のコミットの要約になる
      - name: PR タイトルが Conventional Commits の形か
        run: ./scripts/check-pr-title.sh
      # 検査が名指しする mokume の起票が、再現のファイルと本文の骨格を持つか (ADR-0012)。
      # mokume は public なので、contents: read の token で本文が読める
      - name: mokume への起票が骨格を持つか
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/filing.py check
